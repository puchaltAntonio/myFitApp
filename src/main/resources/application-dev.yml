spring:
  config:
    import: optional:file:api.env.dev[.properties]
  datasource:
    url: ${POSTGRES_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_DB_USER}
    password: ${POSTGRES_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    database: POSTGRESQL
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 15
          lob:
            non_contextual_creation: true
          order_inserts: true
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL_EXTERNAL}/realms/${KEYCLOAK_REALM_NAME}
          jwk-set-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/certs


api:
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm-name: ${KEYCLOAK_REALM_NAME}
    client-id: ${KEYCLOAK_CLIENT_ID}
    secret: ${KEYCLOAK_CLIENT_SECRET}